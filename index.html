<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Repository Card</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --button: #24292f;
      --button-hover: #111418;
      --accent: #1a73e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: transparent;
      font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      color: var(--text);
    }

    .repo-card {
      width: min(100%, 900px);
      padding: 24px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .repo-label {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .repo-title {
      margin: 0 0 12px;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.25;
      letter-spacing: 0;
    }

    .repo-description {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .repo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
      padding: 0;
      list-style: none;
    }

    .repo-meta li {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
    }

    .repo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .repo-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border-radius: 6px;
      background: var(--button);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: background 160ms ease;
    }

    .repo-button:hover,
    .repo-button:focus {
      background: var(--button-hover);
    }

    .repo-link {
      color: var(--accent);
      font-size: 14px;
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .repo-link:hover,
    .repo-link:focus {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      body {
        display: block;
      }

      .repo-card {
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }
    }
  </style>
</head>
<body>
  <main class="repo-card" aria-labelledby="repo-title">
    <p class="repo-label">GitHub Repository</p>
    <h1 class="repo-title" id="repo-title">リポジトリ名をここに入れてください</h1>
    <p class="repo-description">
      プロジェクトのソースコード、README、更新履歴をGitHubで公開しています。
      研究・開発内容の補足資料としてご確認ください。
    </p>

    <ul class="repo-meta" aria-label="リポジトリ情報">
      <li>Source Code</li>
      <li>README</li>
      <li>Public Repository</li>
    </ul>

    <div class="repo-actions">
      <a class="repo-button" href="https://github.com/USERNAME/REPOSITORY" target="_blank" rel="noopener">
        GitHubで見る
      </a>
      <a class="repo-link" href="https://github.com/USERNAME/REPOSITORY" target="_blank" rel="noopener">
        https://github.com/USERNAME/REPOSITORY
      </a>
    </div>
  </main>
</body>
</html>
